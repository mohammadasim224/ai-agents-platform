<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voltaik AI | Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --void: #06040f;
        --plum: #170a30;
        --plum2: #241044;
        --violet: #8b3bff;
        --violet2: #ad6bff;
        --amber: #ffbe2e;
        --paper: #f8f7ff;
        --muted: #a99fbe;
        --line: rgba(236, 220, 255, .13);
        --line-strong: rgba(236, 220, 255, .22);
        --panel: rgba(20, 10, 43, .76);
        --panel-solid: #160a2d;
        --green: #60e19b;
        --red: #ff9d9d;
        --radius: 14px;
        --radius-sm: 10px;
        --shadow: 0 18px 50px rgba(0, 0, 0, .28);
        --shadow-soft: 0 8px 26px rgba(0, 0, 0, .18);
        --ease: cubic-bezier(.23, 1, .32, 1);
        /* The interface is built at comfortable desktop sizes, then scaled down
           slightly so more content fits on screen without looking cramped. The
           layout maths below compensate for the zoom so nothing overflows. */
        --ui-scale: .88;
      }
      * { box-sizing: border-box; }
      @keyframes rise-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes slide-in { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes glow-pulse { 0%,100% { box-shadow: 0 0 0 rgba(139,59,255,0); } 50% { box-shadow: 0 0 24px rgba(139,59,255,.18); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes shimmer { 0% { background-position: -220% 0; } 100% { background-position: 220% 0; } }
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      body { margin: 0; min-width: 320px; color: var(--paper); background: var(--void); font: 13px/1.5 Inter, sans-serif; -webkit-font-smoothing: antialiased; }
      button, textarea, input, select { font: inherit; }
      button { border: 0; cursor: pointer; }
      svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      ::selection { background: rgba(173,107,255,.35); }
      :focus-visible { outline: 2px solid rgba(173,107,255,.75); outline-offset: 2px; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { border: 3px solid transparent; border-radius: 10px; background: rgba(173,107,255,.28); background-clip: content-box; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(173,107,255,.5); background-clip: content-box; }

      /* The shell is scaled down so the default view feels comfortable rather
         than oversized. `100vh / scale` keeps it filling the viewport: without
         it the zoomed grid would stop short of the bottom edge. Zoom is applied
         to the shell (not `body`) so fixed-position modals and toasts stay
         anchored to the real viewport and are not scaled with the page. */
      .app { min-height: calc(100vh / var(--ui-scale)); zoom: var(--ui-scale); display: grid; grid-template-columns: 264px minmax(0, 1fr); background: radial-gradient(circle at 66% 9%, rgba(139,59,255,.15), transparent 31%), radial-gradient(circle at 92% 72%, rgba(255,190,46,.07), transparent 25%); }
      .sidebar { display: flex; flex-direction: column; padding: 24px 14px 16px; border-right: 1px solid var(--line); background: rgba(7,4,18,.74); animation: slide-in .65s var(--ease) both; }
      .brand { display: flex; align-items: center; gap: 10px; padding: 0 12px 20px; color: var(--paper); font: 700 18px 'Space Grotesk', sans-serif; letter-spacing: -.05em; }
      .brand-mark { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 9px; color: var(--void); background: linear-gradient(135deg, var(--violet2), var(--amber)); box-shadow: 0 0 24px rgba(139,59,255,.4); font-weight: 800; }
      .brand em { font-style: normal; background: linear-gradient(120deg, var(--violet2), var(--amber)); -webkit-background-clip: text; background-clip: text; color: transparent; }

      .eyebrow { color: var(--muted); text-transform: uppercase; letter-spacing: .13em; font-size: 10px; font-weight: 700; }
      .profile-switcher { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; margin-bottom: 18px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: rgba(255,255,255,.035); cursor: pointer; transition: border-color .2s, background .2s; }
      .profile-switcher:hover { border-color: rgba(173,107,255,.45); background: rgba(139,59,255,.09); }
      .profile-switcher strong { display: block; font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
      .profile-switcher small { color: #7f7694; font-size: 10px; }
      .profile-switcher svg { width: 14px; height: 14px; }

      .nav { display: grid; gap: 5px; }
      .nav a { display: flex; align-items: center; gap: 11px; padding: 10px 12px; color: var(--muted); border-radius: 9px; text-decoration: none; transition: color .2s, background .2s, transform .2s; animation: slide-in .5s var(--ease) both; }
      .nav a:nth-child(1) { animation-delay: .16s; } .nav a:nth-child(2) { animation-delay: .22s; } .nav a:nth-child(3) { animation-delay: .28s; } .nav a:nth-child(4) { animation-delay: .34s; } .nav a:nth-child(5) { animation-delay: .40s; }
      .nav a:hover { transform: translateX(3px); }
      .nav a:hover, .nav a.active { color: var(--paper); background: linear-gradient(90deg, rgba(139,59,255,.22), rgba(139,59,255,.06)); }
      .nav a.active { box-shadow: inset 2px 0 0 var(--violet2); }
      .nav a.active svg { color: var(--violet2); }
      .nav a .badge { display: grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; margin-left: auto; border-radius: 9px; color: var(--void); background: var(--amber); font-size: 9px; font-weight: 800; }
      /* `display: grid` above would otherwise override the `hidden` attribute. */
      .nav a .badge[hidden] { display: none; }
      .nav-section { margin: 22px 12px 7px; }
      .sidebar-bottom { margin-top: auto; border-top: 1px solid var(--line); padding: 16px 8px 0; }
      .profile { display: flex; gap: 10px; align-items: center; }
      .avatar { display: grid; place-items: center; width: 31px; height: 31px; border-radius: 50%; color: var(--void); background: var(--amber); font-weight: 700; font-size: 11px; }
      .profile strong { display: block; font-size: 11px; }
      .profile small { color: var(--muted); font-size: 10px; }

      .main { min-width: 0; padding: 0 38px 44px; }
      .topbar { height: 76px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
      .crumbs { color: var(--muted); font-size: 12px; }
      .crumbs b { color: var(--paper); font-weight: 500; }
      .crumbs span { margin: 0 7px; color: #554b68; }
      .top-actions { display: flex; gap: 10px; }
      .icon-button { display: grid; place-items: center; width: 34px; height: 34px; color: var(--muted); border: 1px solid var(--line); border-radius: 9px; background: rgba(255,255,255,.025); transition: color .2s, border-color .2s, transform .2s; }
      .icon-button:hover { color: var(--paper); border-color: rgba(173,107,255,.5); transform: translateY(-1px); }

      .content { width: min(100%, 1180px); margin: 0 auto; padding-top: 32px; }
      .page-view { padding-bottom: 40px; animation: rise-in .6s var(--ease) both; }
      .page-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
      .page-header p { max-width: 560px; color: var(--muted); font-size: 13px; margin-top: 10px; }
      .page-actions { display: flex; gap: 8px; flex-wrap: wrap; }
      h1 { margin: 0; font: 700 clamp(26px, 3.6vw, 40px)/1.02 'Space Grotesk', sans-serif; letter-spacing: -.05em; }
      h2 { margin: 0; font: 700 16px 'Space Grotesk', sans-serif; letter-spacing: -.03em; }
      h3 { margin: 0; font: 700 13px 'Space Grotesk', sans-serif; }

      .primary-action, .secondary-action { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 13px; border-radius: 8px; font-size: 11px; font-weight: 700; transition: transform .2s, border-color .2s, color .2s, box-shadow .2s; }
      .primary-action { color: #180b2f; background: linear-gradient(120deg, var(--violet2), var(--amber)); box-shadow: 0 6px 20px rgba(139,59,255,.22); }
      .primary-action:hover { transform: translateY(-1px); box-shadow: 0 10px 26px rgba(139,59,255,.32); }
      .secondary-action { color: #ddd3eb; border: 1px solid var(--line); background: rgba(255,255,255,.035); }
      .secondary-action:hover { border-color: rgba(173,107,255,.5); color: var(--paper); }
      .primary-action:disabled, .secondary-action:disabled { opacity: .5; cursor: default; transform: none; box-shadow: none; }

      .panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow-soft); backdrop-filter: blur(6px); }
      .data-panel { padding: 18px; margin-bottom: 18px; }
      .data-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
      .search-input, .setting-input, .select-input { width: 100%; padding: 10px 12px; color: var(--paper); border: 1px solid var(--line); border-radius: 8px; outline: 0; background: rgba(5,3,13,.6); transition: border-color .2s, box-shadow .2s; }
      .search-input { max-width: 300px; }
      .search-input:focus, .setting-input:focus, .select-input:focus { border-color: rgba(173,107,255,.6); box-shadow: 0 0 0 3px rgba(139,59,255,.1); }
      .data-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 0; border-top: 1px solid var(--line); }
      .data-row:first-child { border-top: 0; }
      .data-row strong { display: block; color: #e5dcf1; font-size: 12px; font-weight: 600; }
      .data-row small { color: var(--muted); font-size: 10px; }
      .row-actions { display: flex; gap: 7px; flex-shrink: 0; }
      .mini-action { padding: 6px 9px; color: var(--violet2); border: 1px solid var(--line); border-radius: 6px; background: transparent; font-size: 10px; transition: border-color .2s, background .2s; }
      .mini-action.danger { color: var(--red); }
      .mini-action:hover { border-color: rgba(173,107,255,.5); background: rgba(139,59,255,.08); }
      .empty-state { padding: 28px 8px; color: #766b88; text-align: center; font-size: 12px; }

      /* Chat */
      .chat-shell { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
      .chat-panel { display: flex; flex-direction: column; min-height: 560px; position: relative; }
      .chat-panel.dragging { border-color: rgba(173,107,255,.7); box-shadow: 0 0 0 3px rgba(139,59,255,.16), var(--shadow); }
      .chat-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
      /* `min-width: 0` lets the title shrink so it ellipsizes instead of
         colliding with the status indicator beside it. */
      .chat-head h2 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .chat-head .eyebrow { flex: none; padding: 3px 9px; border: 1px solid var(--line); border-radius: 20px; background: rgba(255,255,255,.04); }
      .chat-messages { flex: 1; min-height: 380px; padding: 18px; overflow-y: auto; scroll-behavior: smooth; }
      .msg { display: flex; gap: 10px; margin-bottom: 14px; animation: rise-in .35s var(--ease) both; }
      .msg .avatar { width: 28px; height: 28px; flex: none; font-size: 10px; }
      .msg.user .avatar { background: var(--violet2); color: var(--void); }
      .msg.assistant .avatar { background: var(--plum2); color: var(--paper); }
      .msg .bubble { min-width: 0; max-width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 11px; background: rgba(255,255,255,.03); }
      .msg.user .bubble { background: rgba(139,59,255,.12); border-color: rgba(173,107,255,.3); }
      .msg .bubble .who { display: block; color: var(--muted); font-size: 10px; margin-bottom: 6px; }
      .msg .bubble .text { white-space: pre-wrap; color: #e6def3; font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; }
      .msg .bubble .text.error { color: #ffb4b4; }
      .msg .bubble .meta-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
      .msg .bubble .chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font-size: 9px; background: rgba(255,255,255,.03); }
      .msg .bubble .chip.ok { color: var(--green); }
      .msg .bubble .chip.err { color: var(--red); }
      .msg .bubble .artifact-link { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; margin-top: 8px; color: #180b2f; border-radius: 7px; background: linear-gradient(120deg, var(--amber), #ffd980); font-size: 10px; font-weight: 700; text-decoration: none; transition: transform .2s, box-shadow .2s; }
      .msg .bubble .artifact-link:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(255,190,46,.25); }

      /* Live progress */
      .progress-card { display: flex; gap: 10px; margin-bottom: 14px; animation: rise-in .35s var(--ease) both; }
      .progress-card .avatar { width: 28px; height: 28px; flex: none; font-size: 10px; background: var(--plum2); color: var(--paper); }
      .progress-body { flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid rgba(173,107,255,.28); border-radius: 11px; background: linear-gradient(180deg, rgba(139,59,255,.1), rgba(255,255,255,.02)); }
      .progress-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
      .progress-label { color: #e6def3; font-size: 12px; font-weight: 600; }
      .progress-actions { display: inline-flex; align-items: center; gap: 9px; flex: none; }
      .progress-percent { color: var(--amber); font: 700 13px 'Space Grotesk', sans-serif; font-variant-numeric: tabular-nums; }
      /* Cancel is deliberately quiet: it is available, not encouraged. */
      .cancel-job { padding: 3px 9px; color: var(--muted); border: 1px solid var(--line); border-radius: 20px; background: transparent; font-size: 9px; font-weight: 600; transition: color .2s, border-color .2s, background .2s; }
      .cancel-job:hover:not(:disabled) { color: #ffb4b4; border-color: rgba(255,157,157,.5); background: rgba(255,157,157,.1); }
      .cancel-job:disabled { opacity: .55; cursor: default; }
      .progress-track { position: relative; height: 7px; margin: 10px 0 8px; border-radius: 20px; background: rgba(255,255,255,.07); overflow: hidden; }
      .progress-fill { position: relative; height: 100%; width: 0; border-radius: 20px; background: linear-gradient(90deg, var(--violet), var(--violet2) 55%, var(--amber)); transition: width .6s var(--ease); overflow: hidden; }
      /* A moving highlight keeps the bar feeling alive during long provider
         calls, without dimming the gradient underneath it. */
      .progress-fill::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); background-size: 220% 100%; animation: shimmer 2.2s linear infinite; }
      .progress-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 10px; }
      .progress-meta .eta { font-variant-numeric: tabular-nums; }
      .progress-steps { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
      .progress-steps span { padding: 3px 7px; border: 1px solid var(--line); border-radius: 20px; color: #6f6484; font-size: 9px; }
      .progress-steps span.done { color: var(--green); border-color: rgba(96,225,155,.35); }
      .progress-steps span.current { color: var(--paper); border-color: rgba(173,107,255,.6); background: rgba(139,59,255,.16); }
      /* Live activity feed: the running commentary of what the pipeline is
         doing. It scrolls within a fixed height so a long job cannot push the
         rest of the page around, and the newest line is always at the bottom. */
      .activity-feed { margin-top: 10px; max-height: 190px; overflow-y: auto; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: rgba(0,0,0,.22); font-size: 10px; line-height: 1.5; }
      .activity-line { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0; color: #b9aecb; }
      .activity-line + .activity-line { border-top: 1px solid rgba(255,255,255,.04); }
      .activity-line.ok .activity-text { color: var(--green); }
      .activity-line.error .activity-text { color: #ff9d9d; }
      .activity-agent { flex: none; padding: 1px 6px; border-radius: 20px; background: rgba(139,59,255,.18); color: #cbb6f0; font-size: 9px; font-weight: 600; }
      .activity-text { flex: 1; min-width: 0; }
      /* The streamed generation preview: monospace so the text does not reflow
         as it grows, and clamped so a long deliverable cannot dominate the card. */
      .activity-preview { flex-basis: 100%; margin: 4px 0 2px; padding: 6px 8px; max-height: 120px; overflow: hidden; border-left: 2px solid rgba(173,107,255,.5); border-radius: 4px; background: rgba(255,255,255,.03); color: #d8cfe8; font: 10px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
      .queue-card .activity-feed { max-height: 130px; font-size: 9px; }
      .queue-card .activity-preview { max-height: 80px; font-size: 9px; }
      .typing { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 11px; }
      .typing .dots { display: inline-flex; gap: 3px; }
      .typing .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--violet2); animation: glow-pulse 1s infinite; }

      .chat-composer { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); }
      .chat-composer textarea { flex: 1; min-height: 44px; max-height: 140px; resize: vertical; padding: 12px; color: var(--paper); border: 1px solid rgba(236,220,255,.16); border-radius: var(--radius-sm); outline: 0; background: rgba(5,3,13,.72); line-height: 1.5; transition: border-color .2s, box-shadow .2s; }
      .chat-composer textarea:focus { border-color: rgba(173,107,255,.65); box-shadow: 0 0 0 3px rgba(139,59,255,.09); }
      .chat-composer .send { display: grid; place-items: center; width: 42px; height: 42px; border-radius: var(--radius-sm); color: #180b2f; background: linear-gradient(120deg, var(--violet2), var(--amber)); transition: transform .2s, box-shadow .2s; }
      .chat-composer .send:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(139,59,255,.3); }
      .chat-composer .send:disabled { opacity: .5; }
      .chat-tools { display: flex; gap: 7px; padding: 8px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
      .chat-tools .tool { display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; color: var(--muted); border: 1px solid var(--line); border-radius: 7px; background: transparent; font-size: 10px; transition: color .2s, border-color .2s, background .2s; }
      .chat-tools .tool:hover { color: var(--paper); border-color: rgba(173,107,255,.5); }
      .chat-tools .tool.active { color: var(--paper); background: rgba(139,59,255,.14); border-color: rgba(173,107,255,.5); }

      /* Attachments */
      .attach-chips { display: flex; gap: 7px; padding: 0 18px 10px; flex-wrap: wrap; }
      .attach-chip { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; padding: 5px 8px 5px 10px; border: 1px solid rgba(173,107,255,.35); border-radius: 20px; background: rgba(139,59,255,.12); font-size: 10px; animation: fade-in .25s both; }
      .attach-chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 190px; }
      .attach-chip .size { color: var(--muted); font-variant-numeric: tabular-nums; }
      .attach-chip .remove { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; color: var(--muted); background: rgba(255,255,255,.07); font-size: 11px; line-height: 1; }
      .attach-chip .remove:hover { color: var(--paper); background: rgba(255,157,157,.28); }
      .attach-chip.uploading { border-color: rgba(255,190,46,.4); background: rgba(255,190,46,.1); }
      .attach-chip.failed { border-color: rgba(255,157,157,.45); background: rgba(255,157,157,.1); }
      .attach-chip .bar { width: 46px; height: 4px; border-radius: 20px; background: rgba(255,255,255,.12); overflow: hidden; }
      .attach-chip .bar i { display: block; height: 100%; width: 0; background: var(--amber); transition: width .2s linear; }
      .drop-hint { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; border-radius: var(--radius); background: rgba(10,5,24,.82); backdrop-filter: blur(3px); color: var(--paper); font-size: 13px; font-weight: 600; pointer-events: none; animation: fade-in .2s both; }
      .drop-hint span { padding: 14px 22px; border: 1px dashed rgba(173,107,255,.6); border-radius: 12px; background: rgba(139,59,255,.12); }

      .side-stack { display: grid; gap: 16px; }
      .side-panel { padding: 16px; }
      .panel-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
      .text-link { color: var(--violet2); background: none; font-size: 10px; }
      .text-link:hover { color: var(--amber); }
      .history-list { display: grid; gap: 9px; max-height: 300px; overflow-y: auto; }
      .history-item { padding: 9px 10px; border-left: 2px solid transparent; cursor: pointer; transition: background .2s, transform .2s; }
      .history-item:hover { transform: translateX(3px); }
      .history-item:hover, .history-item.current { border-left-color: var(--amber); background: rgba(255,255,255,.035); }
      .history-item strong { display: block; overflow: hidden; color: #dfd4ef; font-size: 11px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
      .history-item small { color: #766b88; font-size: 10px; }
      .attach-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.025); }
      .attach-row .a-body { min-width: 0; }
      .attach-row strong { display: block; overflow: hidden; color: #dfd4ef; font-size: 11px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
      .attach-row small { color: #766b88; font-size: 10px; }
      .attach-row .remove { flex: none; color: var(--muted); background: none; font-size: 13px; line-height: 1; }
      .attach-row .remove:hover { color: var(--red); }

      /* Queue */
      .queue-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
      .queue-card { padding: 14px; border: 1px solid var(--line); border-radius: 11px; background: rgba(255,255,255,.025); transition: transform .25s var(--ease), border-color .25s; }
      .queue-card:hover { transform: translateY(-3px); border-color: rgba(173,107,255,.4); }
      .queue-card .q-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .queue-card h3 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .status-pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 20px; font-size: 9px; font-weight: 700; text-transform: capitalize; }
      .status-pill.queued { color: #d8cbe9; background: rgba(139,59,255,.14); }
      .status-pill.running { color: var(--amber); background: rgba(255,190,46,.12); }
      .status-pill.running i { width: 8px; height: 8px; border: 1.5px solid var(--amber); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
      .status-pill.done { color: var(--green); background: rgba(96,225,155,.12); }
      .status-pill.failed { color: var(--red); background: rgba(255,157,157,.12); }
      .status-pill.cancelled { color: #d8cbe9; background: rgba(255,255,255,.07); }
      .queue-card p { margin: 8px 0 0; color: var(--muted); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .queue-card .q-error { margin-top: 8px; color: var(--red); font-size: 10px; }
      .queue-card .q-actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 10px; }
      .queue-card .q-progress { margin-top: 10px; }
      .queue-card .q-progress .progress-track { height: 6px; margin: 0 0 6px; }
      .queue-card .q-progress .progress-meta { font-size: 9px; }
      .queue-card .q-eta { font-variant-numeric: tabular-nums; }
      .queue-card .q-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; color: #766b88; font-size: 10px; }

      /* Profiles */
      .profile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
      .profile-card { padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.025); transition: transform .25s var(--ease), border-color .25s, box-shadow .25s; }
      .profile-card:hover { transform: translateY(-3px); border-color: rgba(173,107,255,.4); box-shadow: var(--shadow-soft); }
      .profile-card.active { border-color: rgba(255,190,46,.5); box-shadow: 0 0 0 1px rgba(255,190,46,.2); }
      .profile-card .p-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
      .profile-card .avatar { width: 34px; height: 34px; font-size: 12px; }
      .profile-card h3 { font: 700 14px 'Space Grotesk', sans-serif; }
      .profile-card p { margin: 0; color: var(--muted); font-size: 11px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
      .profile-card .p-actions { display: flex; gap: 7px; margin-top: 14px; flex-wrap: wrap; }
      .profile-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .form-field { display: grid; gap: 6px; }
      .form-field label { color: #d9cdeb; font-size: 11px; }
      .form-field small { color: var(--muted); font-size: 10px; }
      .form-field input, .form-field textarea, .form-field select { padding: 10px 12px; color: var(--paper); border: 1px solid var(--line); border-radius: 8px; outline: 0; background: rgba(5,3,13,.6); }
      .form-field textarea { min-height: 70px; resize: vertical; }
      .form-field input:focus, .form-field textarea:focus, .form-field select:focus { border-color: rgba(173,107,255,.6); }
      .form-field.full { grid-column: 1 / -1; }
      .build-result { margin-top: 14px; padding: 12px; border: 1px solid rgba(173,107,255,.35); border-radius: 9px; background: rgba(139,59,255,.08); color: #d8cbe9; font-size: 11px; }

      /* Memory */
      .memory-list { display: grid; gap: 10px; }
      .memory-item { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255,255,255,.025); }
      .memory-item .m-body strong { display: block; color: #e5dcf1; font-size: 12px; }
      .memory-item .m-body small { color: var(--muted); font-size: 10px; }
      .memory-add { display: grid; grid-template-columns: 1fr 150px auto; gap: 8px; margin-bottom: 16px; }
      .memory-add input, .memory-add select { padding: 10px 12px; color: var(--paper); border: 1px solid var(--line); border-radius: 8px; outline: 0; background: rgba(5,3,13,.6); }

      /* Knowledge */
      .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
      .file-card { position: relative; min-height: 150px; padding: 15px; border: 1px solid var(--line); border-radius: 11px; background: rgba(255,255,255,.025); transition: transform .25s var(--ease), border-color .25s, box-shadow .25s; }
      .file-card:hover { transform: translateY(-4px); border-color: rgba(173,107,255,.42); box-shadow: var(--shadow-soft); }
      .file-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
      .file-type { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 9px; color: #180b2f; font-size: 10px; font-weight: 800; background: var(--violet2); }
      .file-type.pdf { color: #fff0f0; background: #c95570; } .file-type.docx { color: #e7f0ff; background: #487bd1; } .file-type.txt { color: #20172d; background: var(--amber); } .file-type.other { color: #eee5ff; background: #694d8d; }
      .file-card h3 { overflow: hidden; margin: 14px 0 4px; color: #e5dcf1; font: 600 12px 'Space Grotesk', sans-serif; text-overflow: ellipsis; white-space: nowrap; }
      .file-card small { color: var(--muted); font-size: 10px; }
      .file-card-actions { display: flex; gap: 6px; margin-top: 13px; }
      .create-form { display: grid; grid-template-columns: 180px 1fr auto; gap: 10px; align-items: end; }
      .create-form label { display: grid; gap: 6px; color: #d9cdeb; font-size: 10px; }
      .create-form textarea { min-height: 42px; height: 42px; resize: vertical; padding: 10px; font-size: 11px; }

      /* Team */
      .agent-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
      .team-group { margin-bottom: 26px; }
      .team-group h2 { margin-bottom: 12px; color: #cdbfe4; font: 700 13px 'Space Grotesk', sans-serif; }
      .agent-card { padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.025); }
      .agent-card .agent-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
      .agent-card .avatar { color: var(--paper); background: var(--plum2); }
      .agent-card h3 { font: 700 14px 'Space Grotesk', sans-serif; }
      .agent-card p { min-height: 42px; color: var(--muted); font-size: 11px; }

      /* Modal */
      .modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 22px; background: rgba(3,2,9,.76); backdrop-filter: blur(8px); animation: fade-in .25s both; }
      .modal-dialog { width: min(860px, 100%); max-height: min(760px, 92vh); overflow: auto; padding: 20px; border: 1px solid rgba(173,107,255,.35); border-radius: 14px; background: var(--panel-solid); box-shadow: 0 25px 100px rgba(0,0,0,.5); animation: rise-in .3s var(--ease) both; }
      .modal-dialog header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
      .modal-dialog h2 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .modal-close { display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: transparent; font-size: 14px; transition: color .2s, border-color .2s; }
      .modal-close:hover { color: var(--paper); border-color: rgba(173,107,255,.5); }
      .preview-content { min-height: 260px; max-height: 520px; overflow: auto; padding: 16px; color: #ddd3eb; border: 1px solid var(--line); border-radius: 9px; background: rgba(5,3,13,.7); font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }

      .toast { position: fixed; right: 24px; bottom: 24px; max-width: 340px; padding: 12px 15px; color: var(--paper); border: 1px solid rgba(173,107,255,.35); border-radius: 9px; background: #1c0d38; box-shadow: 0 15px 40px rgba(0,0,0,.35); transform: translateY(20px); opacity: 0; pointer-events: none; transition: .25s var(--ease); font-size: 11px; z-index: 100; }
      .toast.show { opacity: 1; transform: translateY(0); }
      .toast.error { border-color: rgba(255,157,157,.5); }
      #fileInput { display: none; }

      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }
      @media (max-width: 900px) { .app { grid-template-columns: 70px minmax(0,1fr); } .sidebar { padding: 20px 10px; } .brand { padding: 0 10px 20px; } .brand > span:not(.brand-mark), .profile-switcher strong, .profile-switcher small, .nav a span, .nav-section, .sidebar-bottom { display: none; } .profile-switcher { justify-content: center; padding: 10px 0; } .nav a { justify-content: center; } .main { padding-inline: 22px; } }
      @media (max-width: 680px) { .main { padding-inline: 14px; } .topbar { height: 62px; } .content { padding-top: 26px; } .chat-shell { grid-template-columns: 1fr; } .profile-form { grid-template-columns: 1fr; } .agent-grid { grid-template-columns: 1fr; } .file-grid { grid-template-columns: 1fr 1fr; } .memory-add { grid-template-columns: 1fr; } .page-header { flex-direction: column; align-items: flex-start; } }
      @media (max-width: 440px) { .file-grid { grid-template-columns: 1fr; } .chat-composer { flex-direction: column; } .chat-composer .send { width: 100%; } }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark">v</span><span>voltaik <em>AI</em></span></div>
        <div class="eyebrow">Business profile</div>
        <div class="profile-switcher" id="profileSwitcher" title="Switch business profile">
          <div><strong id="profileName">Loading...</strong><small id="profileType">Business profile</small></div>
          <svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg>
        </div>
        <nav class="nav">
          <a class="active" href="#chat"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg><span>Chat</span></a>
          <a href="#queue"><svg viewBox="0 0 24 24"><path d="M5 4h9l5 5v11H5z"/><path d="M14 4v5h5"/></svg><span>Queue</span><span class="badge" id="queueBadge" hidden>0</span></a>
          <a href="#history"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/><path d="M12 7v5l3 2"/></svg><span>History</span></a>
          <a href="#memory"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg><span>Memory</span></a>
          <a href="#knowledge"><svg viewBox="0 0 24 24"><path d="M5 4h9l5 5v11H5z"/><path d="M14 4v5h5"/></svg><span>Knowledge</span></a>
        </nav>
        <div class="nav-section eyebrow">Manage</div>
        <nav class="nav">
          <a href="#profiles"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2"/><path d="M3 20c.5-4 2.5-6 6-6s5.5 2 6 6M15 15c3 0 5 1.5 6 5"/></svg><span>Profiles</span></a>
          <a href="#team"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4 2c-1.5 1-1.5 2-1.5 3M12 17h.01"/></svg><span>AI team</span></a>
        </nav>
        <div class="sidebar-bottom"><div class="profile"><div class="avatar">MB</div><div><strong>Mohamed</strong><small>Owner</small></div></div></div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="crumbs">Workspace <span>/</span> <b id="crumb">Chat</b></div>
          <div class="top-actions">
            <button class="icon-button" id="helpButton" title="Help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4 2c-1.5 1-1.5 2-1.5 3M12 17h.01"/></svg></button>
          </div>
        </header>
        <div class="content" id="content"></div>
      </main>
    </div>
    <div class="toast" id="toast"></div>
    <input id="fileInput" type="file" multiple accept=".txt,.md,.csv,.json,.html,.pdf,.doc,.docx" hidden />
    <script src="app.js"></script>
  </body>
</html>
